version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: huertohogar-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huertohogar-net

  ms-usuarios:
    build: ./ms-usuarios
    container_name: huertohogar-ms-usuarios
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:-HuertoHogarSuperSecretKey2026JwtAuthentication512BitsLongEnough!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - huertohogar-net

  ms-categorias:
    build: ./ms-categorias
    container_name: huertohogar-ms-categorias
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_categorias?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:-HuertoHogarSuperSecretKey2026JwtAuthentication512BitsLongEnough!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - huertohogar-net

  ms-productos:
    build: ./ms-productos
    container_name: huertohogar-ms-productos
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:-HuertoHogarSuperSecretKey2026JwtAuthentication512BitsLongEnough!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - huertohogar-net

  ms-ventas:
    build: ./ms-ventas
    container_name: huertohogar-ms-ventas
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_ventas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:-HuertoHogarSuperSecretKey2026JwtAuthentication512BitsLongEnough!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      MS_PRODUCTOS_URL: http://ms-productos:8083/api/products
    depends_on:
      mysql-db:
        condition: service_healthy
      ms-productos:
        condition: service_started
    networks:
      - huertohogar-net

  ms-reportes:
    build: ./ms-reportes
    container_name: huertohogar-ms-reportes
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_reportes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:-HuertoHogarSuperSecretKey2026JwtAuthentication512BitsLongEnough!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      MS_VENTAS_URL: http://ms-ventas:8084/api/orders
      MS_PRODUCTOS_URL: http://ms-productos:8083/api/products
    depends_on:
      mysql-db:
        condition: service_healthy
      ms-ventas:
        condition: service_started
      ms-productos:
        condition: service_started
    networks:
      - huertohogar-net

  ms-swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: huertohogar-ms-swagger
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      URLS_PRIMARY_NAME: "Microservicio Usuarios"
      URLS: "[ \
        { url: 'http://${SWAGGER_HOST:-localhost}:8081/v3/api-docs', name: 'Microservicio Usuarios (8081)' }, \
        { url: 'http://${SWAGGER_HOST:-localhost}:8082/v3/api-docs', name: 'Microservicio Categorias (8082)' }, \
        { url: 'http://${SWAGGER_HOST:-localhost}:8083/v3/api-docs', name: 'Microservicio Productos (8083)' }, \
        { url: 'http://${SWAGGER_HOST:-localhost}:8084/v3/api-docs', name: 'Microservicio Ventas (8084)' }, \
        { url: 'http://${SWAGGER_HOST:-localhost}:8085/v3/api-docs', name: 'Microservicio Reportes (8085)' } \
      ]"
    depends_on:
      - ms-usuarios
      - ms-categorias
      - ms-productos
      - ms-ventas
      - ms-reportes
    networks:
      - huertohogar-net

networks:
  huertohogar-net:
    driver: bridge

volumes:
  mysql_data:
