spring.application.name=ms-reportes
server.port=8085

spring.datasource.url=jdbc:h2:mem:db_reportes;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html

ms.ventas.url=${MS_VENTAS_URL:http://localhost:8084/api/orders}
ms.productos.url=${MS_PRODUCTOS_URL:http://localhost:8083/api/products}
